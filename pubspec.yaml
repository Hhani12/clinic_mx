name: clinic
description: "Clinic MX - Production-grade clinic management app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.1.0
  flutter_local_notifications: ^19.4.0
  url_launcher: ^6.3.2
  table_calendar: ^3.2.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.4
  uuid: ^4.5.3
  file_picker: ^8.0.0
  collection: ^1.19.1
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assests/images/
