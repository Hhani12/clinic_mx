name: clinic
description: "Locas Clinic - Production-grade clinic management app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.1.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.1.0
  flutter_local_notifications: ^19.4.0
  url_launcher: ^6.3.2
  table_calendar: ^3.2.0
  intl: ^0.20.2
  google_fonts: ^8.0.2
  shared_preferences: ^2.5.4
  uuid: ^4.5.3
  file_picker: ^8.0.0
  collection: ^1.19.1
  timezone: ^0.10.1
  web: ^1.1.0
  webview_windows: ^0.4.0
  pdf: ^3.11.1
  printing: ^5.13.2

  # Local database (desktop offline-first sync)
  path: ^1.9.0
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.4
  connectivity_plus: ^6.1.0

  # Secure storage for session tokens
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assests/images/
    - assets/3d_model/
